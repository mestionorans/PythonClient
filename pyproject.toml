[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vertex-client"
version = "0.1.0"
description = "Vertex client for Library of Mestionora (I2P backup network)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
gui = ["customtkinter>=5.2"]

[project.scripts]
vertex-cli = "CLI.app:main"
vertex-gui = "GUI.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: tests that exercise CLI + VertexClient with temp dirs (not live I2P)",
    "qbittorrent_integration: requires a live qBittorrent Web API (VERTEX_QBIT_INTEGRATION=1)",
]
